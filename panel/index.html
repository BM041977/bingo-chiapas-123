<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13294b">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Bingo Electoral</title>
<link rel="icon" href="../escaner/icons/icon-192.png">
<style>
  :root { --navy:#13294b; --gold:#c9a227; --bg:#f3f5f9; --card:#fff; --tx:#1b2433; --mut:#64708a; --ok:#1f8a4c; --bad:#c0392b; --warn:#b7791f; --line:#dde3ec; --soft:#e9eef6; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--tx); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:16px; }
  header { background:var(--navy); color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; gap:12px; }
  header img { height:34px; width:auto; display:block; }
  header b { color:var(--gold); font-size:15px; letter-spacing:.3px; }
  header .sp { margin-left:auto; }
  header button { background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:20px; padding:6px 12px; font-size:13px; cursor:pointer; }
  main { max-width:980px; margin:0 auto; padding:16px 16px calc(28px + env(safe-area-inset-bottom)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  h1 { font-size:22px; margin:2px 0 2px; color:var(--navy); }
  h2 { font-size:16px; margin:0 0 12px; color:var(--navy); }
  .sub { color:var(--mut); font-size:13px; }
  label { display:block; font-size:13px; color:var(--mut); margin:12px 0 4px; }
  input { width:100%; font-size:19px; padding:12px; border:1px solid var(--line); border-radius:8px; letter-spacing:4px; text-align:center; }
  input.txt { letter-spacing:normal; text-align:left; font-size:16px; }
  input:focus { outline:2px solid var(--gold); border-color:var(--gold); }
  .btn { display:block; width:100%; padding:14px; font-size:17px; font-weight:600; border:0; border-radius:10px; margin-top:14px; cursor:pointer; background:var(--navy); color:#fff; }
  .btn:disabled { opacity:.5; }
  .msg { margin-top:12px; padding:10px 12px; border-radius:8px; font-size:14px; }
  .msg.bad { background:#fdecea; color:var(--bad); } .msg.warn { background:#fff7e0; color:var(--warn); }
  .hide { display:none !important; }
  #v-login { max-width:380px; margin:40px auto 0; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .kpi .n { font-size:28px; font-weight:700; color:var(--navy); line-height:1.1; }
  .kpi .t { font-size:12px; color:var(--mut); margin-top:4px; }
  .prog { height:14px; background:var(--soft); border-radius:8px; overflow:hidden; margin:8px 0 4px; }
  .prog > i { display:block; height:100%; background:var(--gold); border-radius:8px; }
  .tabs { display:inline-flex; background:var(--soft); border-radius:20px; padding:3px; margin-bottom:10px; }
  .tabs button { border:0; background:transparent; padding:6px 14px; border-radius:18px; font-size:13px; cursor:pointer; color:var(--mut); }
  .tabs button.on { background:var(--navy); color:#fff; }
  .chart { width:100%; overflow-x:auto; }
  svg text { font-family:inherit; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--mut); font-weight:600; font-size:12px; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.click { cursor:pointer; } tr.click:hover { background:var(--soft); }
  .mini { height:8px; background:var(--soft); border-radius:5px; overflow:hidden; min-width:70px; }
  .mini > i { display:block; height:100%; background:var(--navy); }
  .mini.ok > i { background:var(--ok); } .mini.bajo > i { background:var(--bad); } .mini.med > i { background:var(--warn); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media (max-width:760px) { .grid2 { grid-template-columns:1fr; } }
  .back { background:none; border:0; color:var(--navy); font-size:14px; cursor:pointer; padding:0 0 8px; text-decoration:underline; }
  .nota { font-size:12px; color:var(--mut); margin-top:8px; }

  select { width:100%; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--tx); }
  select:focus { outline:2px solid var(--gold); border-color:var(--gold); }
  .msg.ok { background:#e6f4ea; color:#1f7a45; }
  .tabs.nav { display:flex; overflow-x:auto; max-width:100%; }
  .tabs.nav button { white-space:nowrap; }
  .fila { display:flex; gap:8px; align-items:center; }
  .fila input { flex:1; min-width:0; }
  .fila .btn { width:auto; margin-top:0; padding:11px 18px; font-size:15px; }
  .btn.sec { background:var(--soft); color:var(--navy); }
  .btn.mal { background:var(--bad); }
  .btn.sm { padding:8px 12px; font-size:13px; margin-top:0; width:auto; display:inline-block; }
  .lnk { background:none; border:0; color:var(--navy); text-decoration:underline; cursor:pointer; font-size:13px; padding:4px 6px; }
  .lnk.mal { color:var(--bad); }
  .lnk.blk { display:block; text-align:left; padding:3px 4px; }
  .tabla { overflow-x:auto; }
  .campos { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; } @media (max-width:640px) { .campos { grid-template-columns:1fr; } }
  .campos .full { grid-column:1 / -1; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { min-width:60px; padding:6px 8px; border-radius:8px; color:#fff; font-size:13px; font-weight:700; text-align:center; }
  .chip small { display:block; font-weight:400; font-size:11px; opacity:.95; }
  .chip.ok { background:var(--ok); } .chip.med { background:var(--warn); } .chip.bajo { background:var(--bad); } .chip.sin { background:#a89f94; }
  code.cl { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px; background:var(--soft); padding:2px 6px; border-radius:5px; }
</style>
</head>
<body>
<header>
  <img src="../escaner/icons/logo.png" alt="">
  <b>Panel · Bingo Electoral</b>
  <span class="sp"><button id="b-salir" class="hide">Salir</button></span>
</header>
<main>
  <section id="v-login" class="card">
    <h2>Entrar al panel</h2>
    <p class="sub">Elige tu municipio y escribe tu clave de 6 números. Con la clave de candidato solo puedes ver el avance; no se puede modificar nada.</p>
    <label for="mun">Municipio</label>
    <select id="mun"><option value="">Cargando…</option></select>
    <label for="clave">Clave</label>
    <input id="clave" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••">
    <button class="btn" id="b-entrar">Entrar</button>
    <div id="m-login"></div>
  </section>

  <section id="v-app" class="hide">
    <div class="tabs nav hide" id="nav"></div>
    <div id="p-avance"><section id="v-tab"></section></div>
    <div id="p-dia" class="hide"></div>
    <div id="p-admin" class="hide"></div>
    <div id="p-accesos" class="hide"></div>
    <div id="p-ajustes" class="hide"></div>
  </section>
</main>

<script src="../escaner/config.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const LS = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} } };
const SS = { get(k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch (e) {} } };
const NF = new Intl.NumberFormat('es-MX');
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
let DATA = null, VISTA = { per: 'sem', mun: null }, ROL = '', CLAVE = '', MUN = '', LISTA = [];

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function aviso(el, txt, cls) { el.innerHTML = txt ? '<div class="msg ' + cls + '">' + esc(txt) + '</div>' : ''; }
function sinAcento(x) { return String(x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }

async function api(accion, datos) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ accion }, datos || {})) });
  let j; try { j = await r.json(); } catch (_) { throw new Error('El servidor no respondió bien. Intenta de nuevo en un momento.'); }
  if (!j.ok) throw new Error(j.error || 'Error');
  return j.data;
}
const cargar = (clave, mun) => api('tablero', mun ? { clave, mun } : { clave });

// ---------- entrada
async function iniciarLogin() {
  try { LISTA = (await api('municipios')).sort((a, b) => a.localeCompare(b, 'es')); }
  catch (e) { $('mun').innerHTML = '<option value="">—</option>'; aviso($('m-login'), 'No pude cargar la lista de municipios. Recarga la página.', 'bad'); return; }
  $('mun').innerHTML = '<option value="">Elige…</option><option value="ADMIN">Administración general (todos)</option>' + LISTA.map(m => '<option value="' + esc(m) + '">' + esc(m) + '</option>').join('');
  const adm = SS.get('p_adm'), cm = LS.get('p_mun'), cc = LS.get('p_clave');
  if (adm) { $('mun').value = 'ADMIN'; $('clave').value = adm; entrar(true); }
  else if (cm && cc && LISTA.includes(cm)) { $('mun').value = cm; $('clave').value = cc; entrar(true); }
}
async function entrar(auto) {
  const sel = $('mun').value, clave = $('clave').value.trim();
  if (!sel) return auto ? null : aviso($('m-login'), 'Elige tu municipio (o «Administración general»).', 'bad');
  if (!/^\d{6}$/.test(clave)) return auto ? null : aviso($('m-login'), 'La clave son 6 números.', 'bad');
  $('b-entrar').disabled = true; aviso($('m-login'), 'Entrando…', 'warn');
  try {
    let d = await cargar(clave, sel === 'ADMIN' ? '' : sel);
    if (d.admin && !d.municipios) d = await cargar(clave, '');     // clave general escrita eligiendo un municipio
    DATA = d; CLAVE = clave; ROL = d.admin ? 'admin' : 'cand'; MUN = d.admin ? '' : sel;
    if (ROL === 'admin') { SS.set('p_adm', clave); LS.set('p_mun', ''); LS.set('p_clave', ''); }
    else { LS.set('p_mun', sel); LS.set('p_clave', clave); SS.set('p_adm', ''); }
    VISTA = { per: 'sem', mun: null };
    aviso($('m-login'), '');
    $('v-login').classList.add('hide'); $('v-app').classList.remove('hide'); $('b-salir').classList.remove('hide');
    armarNav(); irA('avance');
  } catch (e) { if (auto) { SS.set('p_adm', ''); LS.set('p_clave', ''); } aviso($('m-login'), e.message, 'bad'); }
  $('b-entrar').disabled = false;
}
$('b-entrar').onclick = () => entrar(false);
$('clave').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(false); });
$('b-salir').onclick = () => {
  SS.set('p_adm', ''); LS.set('p_mun', ''); LS.set('p_clave', '');
  pararDD(); DATA = null; CLAVE = ''; ROL = ''; MUN = ''; $('clave').value = ''; $('mun').value = '';
  ['p-dia', 'p-admin', 'p-accesos', 'p-ajustes'].forEach(id => { $(id).innerHTML = ''; delete $(id).dataset.listo; });
  $('v-app').classList.add('hide'); $('b-salir').classList.add('hide'); $('v-login').classList.remove('hide');
};

// ---------- pestañas (solo la administración general ve todas)
const TABS = { avance: 'Avance', dia: 'Día D', admin: 'Administración', accesos: 'Accesos', ajustes: 'Ajustes' };
function armarNav() {
  const ks = ROL === 'admin' ? ['avance', 'dia', 'admin', 'accesos', 'ajustes'] : ['avance', 'dia'];
  $('nav').innerHTML = ks.map(k => '<button data-t="' + k + '">' + TABS[k] + '</button>').join('');
  $('nav').classList.toggle('hide', !ks.length);
  $('nav').querySelectorAll('button').forEach(b => b.onclick = () => irA(b.dataset.t));
}
function irA(t) {
  pararDD();
  $('nav').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  ['avance', 'dia', 'admin', 'accesos', 'ajustes'].forEach(k => $('p-' + k).classList.toggle('hide', k !== t));
  window.scrollTo(0, 0);
  if (t === 'avance') { pintar(); if (ROL === 'admin' && !VISTA.mun) cargar(CLAVE, '').then(d => { if (DATA && !VISTA.mun) { DATA = d; pintar(); } }).catch(() => {}); }
  else if (t === 'dia') vistaDia();
  else if (t === 'admin') vistaAdministracion();
  else if (t === 'accesos') vistaAccesos();
  else if (t === 'ajustes') vistaAjustes();
}
iniciarLogin();

// ---------- fechas y agrupación
function dUTC(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function iso(ms) { const d = new Date(ms); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); }
function lunes(s) { const ms = dUTC(s), dow = (new Date(ms).getUTCDay() + 6) % 7; return ms - dow * 86400000; }
function etSem(ms) { const d = new Date(ms); return d.getUTCDate() + ' ' + MESES[d.getUTCMonth()]; }
function hoyMX() { return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Mexico_City' })); }
function hoyISO() { const h = hoyMX(); return h.getFullYear() + '-' + String(h.getMonth() + 1).padStart(2, '0') + '-' + String(h.getDate()).padStart(2, '0'); }

function periodos(porDia, per) {          // devuelve [{et, n}] continuo desde el primer periodo hasta hoy
  const ks = Object.keys(porDia).sort(); if (!ks.length) return [];
  const hoy = hoyISO(), fin = hoy > ks[ks.length - 1] ? hoy : ks[ks.length - 1];
  const out = [];
  if (per === 'sem') {
    const m = {}; ks.forEach(k => { const l = lunes(k); m[l] = (m[l] || 0) + porDia[k]; });
    for (let t = lunes(ks[0]); t <= lunes(fin); t += 7 * 86400000) out.push({ et: etSem(t), n: m[t] || 0 });
  } else if (per === 'mes') {
    const m = {}; ks.forEach(k => { const c = k.slice(0, 7); m[c] = (m[c] || 0) + porDia[k]; });
    let [y, mo] = ks[0].split('-').map(Number); const [y2, mo2] = fin.split('-').map(Number);
    while (y < y2 || (y === y2 && mo <= mo2)) { const c = y + '-' + String(mo).padStart(2, '0'); out.push({ et: MESES[mo - 1] + ' ' + String(y).slice(2), n: m[c] || 0 }); mo++; if (mo > 12) { mo = 1; y++; } }
  } else {
    const m = porDia; for (let t = dUTC(ks[0]); t <= dUTC(fin); t += 86400000) { const d = new Date(t); out.push({ et: d.getUTCDate() + '/' + (d.getUTCMonth() + 1), n: m[iso(t)] || 0 }); }
  }
  return out;
}
function suma(porDia, desde) { let s = 0; Object.keys(porDia).forEach(k => { if (k >= desde) s += porDia[k]; }); return s; }
function restaDias(s, n) { return iso(dUTC(s) - n * 86400000); }

// ---------- gráficas (SVG)
function barras(vals, meta) {
  const W = Math.max(320, vals.length * 46), H = 190, pl = 34, pb = 26, pt = 14, mx = Math.max(4, meta || 0, ...vals.map(v => v.n));
  const bw = (W - pl) / vals.length, cell = Math.min(34, bw - 8);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Capturados por periodo">';
  [0, .5, 1].forEach(f => { const y = pt + (H - pt - pb) * (1 - f); s += '<line x1="' + pl + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="#dde3ec"/><text x="' + (pl - 6) + '" y="' + (y + 4) + '" font-size="10" text-anchor="end" fill="#64708a">' + NF.format(Math.round(mx * f)) + '</text>'; });
  vals.forEach((v, i) => {
    const h = (H - pt - pb) * v.n / mx, x = pl + i * bw + (bw - cell) / 2, y = H - pb - h;
    s += '<rect x="' + x + '" y="' + y + '" width="' + cell + '" height="' + Math.max(h, v.n ? 2 : 0) + '" rx="3" fill="' + (meta && v.n >= meta ? '#2f855a' : '#13294b') + '"/>';
    if (v.n) s += '<text x="' + (x + cell / 2) + '" y="' + (y - 4) + '" font-size="10" text-anchor="middle" fill="#1b2433">' + NF.format(v.n) + '</text>';
    s += '<text x="' + (x + cell / 2) + '" y="' + (H - 8) + '" font-size="10" text-anchor="middle" fill="#64708a">' + esc(v.et) + '</text>';
  });
  if (meta) { const y = pt + (H - pt - pb) * (1 - meta / mx); s += '<line x1="' + pl + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="#c9a227" stroke-width="2" stroke-dasharray="6 4"/><text x="' + (W - 2) + '" y="' + (y - 5) + '" font-size="11" text-anchor="end" fill="#b7791f">Meta ' + NF.format(Math.round(meta * 10) / 10) + '</text>'; }
  return s + '</svg>';
}
function acumulado(porDia, meta, total, diaD) {
  const ks = Object.keys(porDia).sort(); if (!ks.length) return '<p class="sub">Aún no hay capturas con fecha.</p>';
  const hoy = hoyISO(), ini = dUTC(ks[0]), fin = Math.max(dUTC(diaD), dUTC(hoy)), W = 640, H = 220, pl = 44, pr = 12, pt = 14, pb = 26;
  const mx = Math.max(meta, total, 1) * 1.05, X = t => pl + (W - pl - pr) * (t - ini) / Math.max(1, fin - ini), Y = v => pt + (H - pt - pb) * (1 - v / mx);
  let acc = 0, pts = [];
  for (let t = ini; t <= dUTC(hoy); t += 86400000) { acc += porDia[iso(t)] || 0; pts.push([X(t), Y(acc)]); }
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Avance acumulado contra la meta">';
  [0, .5, 1].forEach(f => { const y = pt + (H - pt - pb) * (1 - f); s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="#dde3ec"/><text x="' + (pl - 6) + '" y="' + (y + 4) + '" font-size="10" text-anchor="end" fill="#64708a">' + NF.format(Math.round(mx * f)) + '</text>'; });
  s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(meta) + '" y2="' + Y(meta) + '" stroke="#c9a227" stroke-width="2" stroke-dasharray="6 4"/><text x="' + (W - pr) + '" y="' + (Y(meta) - 5) + '" font-size="11" text-anchor="end" fill="#b7791f">Meta ' + NF.format(meta) + '</text>';
  if (dUTC(diaD) > dUTC(hoy)) { const x1 = pts[pts.length - 1][0], y1 = pts[pts.length - 1][1]; s += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + X(dUTC(diaD)) + '" y2="' + Y(meta) + '" stroke="#64708a" stroke-width="1.5" stroke-dasharray="3 4"/>'; }
  s += '<polyline fill="none" stroke="#13294b" stroke-width="2.5" points="' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/>';
  const l = pts[pts.length - 1]; s += '<circle cx="' + l[0] + '" cy="' + l[1] + '" r="4" fill="#13294b"/>';
  const lab = (t, a) => { const d = new Date(t); return '<text x="' + X(t) + '" y="' + (H - 8) + '" font-size="10" text-anchor="' + a + '" fill="#64708a">' + d.getUTCDate() + ' ' + MESES[d.getUTCMonth()] + ' ' + String(d.getUTCFullYear()).slice(2) + '</text>'; };
  s += lab(ini, 'start') + lab(dUTC(diaD), 'end');
  return s + '</svg><div class="nota">Línea gris punteada: ritmo necesario desde hoy para llegar a la meta el día de la elección (' + diaD.split('-').reverse().join('/') + ').</div>';
}

// ---------- vistas
function claseAv(p) { return p >= 80 ? 'ok' : p >= 40 ? 'med' : 'bajo'; }
function kpi(n, t) { return '<div class="kpi"><div class="n">' + n + '</div><div class="t">' + t + '</div></div>'; }

function vistaMunicipio(r, d) {
  const hoy = hoyISO(), pct = r.meta ? Math.min(100, r.total * 100 / r.meta) : 0, falta = Math.max(0, r.meta - r.total);
  const dias = Math.max(0, Math.ceil((dUTC(d.diaD) - dUTC(hoy)) / 86400000)), ritmo = dias ? Math.ceil(falta / dias) : falta;
  const u7 = suma(r.porDia, restaDias(hoy, 6)), upd = r.actualizado ? new Date(r.actualizado).toLocaleString('es-MX', { timeZone: 'America/Mexico_City', dateStyle: 'short', timeStyle: 'short' }) : '';
  let h = '<h1>' + esc(r.nombre) + '</h1><div class="sub">Datos al ' + esc(upd) + ' · ' + NF.format(r.casillas) + ' casillas</div><div style="height:12px"></div>';
  h += '<div class="kpis">' + kpi(NF.format(r.total), 'Promovidos capturados') + kpi(NF.format(r.meta), r.metaReal ? 'Meta (voto duro real)' : 'Meta (supuesto ' + d.metaXCasilla + ' por casilla)') +
       kpi(pct.toFixed(1) + '%', 'Avance de la meta') + kpi(NF.format(u7), 'Capturados en los últimos 7 días') + kpi(NF.format(dias), 'Días para la elección') + kpi(NF.format(ritmo), 'Por día para llegar a la meta') + '</div>';
  h += '<div class="card"><h2>Avance contra la meta</h2><div class="prog"><i style="width:' + pct + '%"></i></div><div class="sub">' + NF.format(r.total) + ' de ' + NF.format(r.meta) + ' · faltan ' + NF.format(falta) + '</div></div>';

function dibujarPromotor(p, diaD, per) {

    kpi(p.meta ? NF.format(Math.round(mP * 10) / 10) : '—', per === 'sem' ? 'Meta por semana' : 'Meta por mes') + kpi(NF.format(act), per === 'sem' ? 'Esta semana' : 'Este mes');

  if (!mun) { $('dd-cuerpo').innerHTML = ''; return; }
  try {
    const r = await api('dia_d', { clave: CLAVE, mun });
    if (mun !== DD.mun) return;                 // cambiaron de municipio mientras cargaba
    aviso($('dd-msg'), ''); pintarDD(r);
  } catch (e) { aviso($('dd-msg'), e.message, 'bad'); }
}
function pintarDD(r) {
  let esp = 0, vot = 0, en0 = 0;
  r.secciones.forEach(s => { esp += s.esperado; vot += s.votaron; if (s.esperado > 0 && s.votaron === 0) en0++; });
  const pct = esp ? Math.round(vot * 1000 / esp) / 10 : 0;
  const hora = new Date(r.consultado).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Mexico_City' });
  const cls = s => !s.esperado ? 'sin' : (s.avance >= 0.67 ? 'ok' : s.avance >= 0.34 ? 'med' : 'bajo');
  let h = '<p class="sub" style="margin:0 0 10px">' + esc(r.municipio) + ' · última consulta <b>' + esc(hora) + '</b> · se actualiza solo cada minuto <button class="lnk" id="dd-act">Actualizar ahora</button></p>';
  h += '<div class="kpis">' + kpi(NF.format(esp), 'Voto duro esperado') + kpi(NF.format(vot), 'Han votado') + kpi(pct.toFixed(1) + '%', 'Avance global') + kpi(NF.format(en0), 'Secciones sin avance') + '</div>';
  h += '<div class="card"><h2>Avance por sección</h2>';
  if (r.secciones.length) {
    h += '<div class="tabla"><table><tr><th>Sección</th><th>Avance</th><th class="num">%</th></tr>' + r.secciones.map(s => {
      const p = Math.round(s.avance * 1000) / 10;
      return '<tr><td>' + esc(s.seccion) + '</td><td>' + (s.esperado ? '<div class="mini ' + cls(s) + '"><i style="width:' + Math.min(100, p) + '%"></i></div><div class="sub">' + NF.format(s.votaron) + ' de ' + NF.format(s.esperado) + '</div>' : '<span class="sub">Sin padrón capturado</span>') +
             '</td><td class="num">' + (s.esperado ? p.toFixed(1) + '%' : '—') + '</td></tr>';
    }).join('') + '</table></div>';
  } else h += '<p class="sub">No encontré secciones para este municipio.</p>';
  h += '</div><div class="card"><h2>Semáforo por sección</h2><div class="chips">' + r.secciones.map(s => '<div class="chip ' + cls(s) + '" title="' + (s.esperado ? NF.format(s.votaron) + ' de ' + NF.format(s.esperado) : 'Sin padrón capturado') + '">' + esc(s.seccion) +
       '<small>' + (s.esperado ? Math.round(s.avance * 100) + '%' : '—') + '</small></div>').join('') + '</div></div>';
  $('dd-cuerpo').innerHTML = h;
  $('dd-act').onclick = cargarDD;
}

// ================= AJUSTES =================
async function vistaAjustes() {
  const el = $('p-ajustes');
  el.innerHTML = '<div class="card"><h2>Fecha de la elección</h2><p class="sub">El tablero usa esta fecha para calcular los días que faltan y el ritmo necesario.</p><label for="aj-f">Fecha</label><div class="fila"><input id="aj-f" type="date" class="txt"><button class="btn" id="aj-g">Guardar</button></div><div id="aj-msg"></div>' +
    '<p class="nota" id="aj-nota"></p></div>';
  try { const c = await api('admin_config', { clave: CLAVE }); $('aj-f').value = c.diaD; $('aj-nota').textContent = 'La meta supuesta es de ' + c.metaXCasilla + ' personas por casilla; se reemplaza municipio por municipio con el «Voto duro real» en Administración.'; }
  catch (e) { aviso($('aj-msg'), e.message, 'bad'); }
  $('aj-g').onclick = async () => {
    aviso($('aj-msg'), 'Guardando…', 'warn'); $('aj-g').disabled = true;
    try { const c = await api('admin_guardar_config', { clave: CLAVE, diaD: $('aj-f').value }); if (DATA) DATA.diaD = c.diaD; aviso($('aj-msg'), 'Fecha guardada: ' + c.diaD.split('-').reverse().join('/') + '.', 'ok'); }
    catch (e) { aviso($('aj-msg'), e.message, 'bad'); }
    $('aj-g').disabled = false;
  };
}
</script>
