<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13294b">
<meta name="robots" content="noindex, nofollow">
<title>Tablero de avance · Bingo Electoral</title>
<link rel="icon" href="../escaner/icons/icon-192.png">
<style>
  :root { --navy:#13294b; --gold:#c9a227; --bg:#f3f5f9; --card:#fff; --tx:#1b2433; --mut:#64708a; --ok:#1f8a4c; --bad:#c0392b; --warn:#b7791f; --line:#dde3ec; --soft:#e9eef6; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--tx); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:16px; }
  header { background:var(--navy); color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; gap:12px; }
  header img { height:34px; width:auto; display:block; }
  header b { color:var(--gold); font-size:15px; letter-spacing:.3px; }
  header .sp { margin-left:auto; }
  header button { background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:20px; padding:6px 12px; font-size:13px; cursor:pointer; }
  main { max-width:980px; margin:0 auto; padding:16px 16px calc(28px + env(safe-area-inset-bottom)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  h1 { font-size:22px; margin:2px 0 2px; color:var(--navy); }
  h2 { font-size:16px; margin:0 0 12px; color:var(--navy); }
  .sub { color:var(--mut); font-size:13px; }
  label { display:block; font-size:13px; color:var(--mut); margin:12px 0 4px; }
  input { width:100%; font-size:19px; padding:12px; border:1px solid var(--line); border-radius:8px; letter-spacing:4px; text-align:center; }
  input.txt { letter-spacing:normal; text-align:left; font-size:16px; }
  input:focus { outline:2px solid var(--gold); border-color:var(--gold); }
  .btn { display:block; width:100%; padding:14px; font-size:17px; font-weight:600; border:0; border-radius:10px; margin-top:14px; cursor:pointer; background:var(--navy); color:#fff; }
  .btn:disabled { opacity:.5; }
  .msg { margin-top:12px; padding:10px 12px; border-radius:8px; font-size:14px; }
  .msg.bad { background:#fdecea; color:var(--bad); } .msg.warn { background:#fff7e0; color:var(--warn); }
  .hide { display:none !important; }
  #v-login { max-width:380px; margin:40px auto 0; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .kpi .n { font-size:28px; font-weight:700; color:var(--navy); line-height:1.1; }
  .kpi .t { font-size:12px; color:var(--mut); margin-top:4px; }
  .prog { height:14px; background:var(--soft); border-radius:8px; overflow:hidden; margin:8px 0 4px; }
  .prog > i { display:block; height:100%; background:var(--gold); border-radius:8px; }
  .tabs { display:inline-flex; background:var(--soft); border-radius:20px; padding:3px; margin-bottom:10px; }
  .tabs button { border:0; background:transparent; padding:6px 14px; border-radius:18px; font-size:13px; cursor:pointer; color:var(--mut); }
  .tabs button.on { background:var(--navy); color:#fff; }
  .chart { width:100%; overflow-x:auto; }
  svg text { font-family:inherit; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--mut); font-weight:600; font-size:12px; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.click { cursor:pointer; } tr.click:hover { background:var(--soft); }
  .mini { height:8px; background:var(--soft); border-radius:5px; overflow:hidden; min-width:70px; }
  .mini > i { display:block; height:100%; background:var(--navy); }
  .mini.ok > i { background:var(--ok); } .mini.bajo > i { background:var(--bad); } .mini.med > i { background:var(--warn); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media (max-width:760px) { .grid2 { grid-template-columns:1fr; } }
  .back { background:none; border:0; color:var(--navy); font-size:14px; cursor:pointer; padding:0 0 8px; text-decoration:underline; }
  .nota { font-size:12px; color:var(--mut); margin-top:8px; }
</style>
</head>
<body>
<header>
  <img src="../escaner/icons/logo.png" alt="">
  <b>Tablero de avance · Bingo Electoral</b>
  <span class="sp"><button id="b-salir" class="hide">Salir</button></span>
</header>
<main>
  <section id="v-login" class="card">
    <h2>Entrar al tablero</h2>
    <p class="sub">Escribe tu clave de consulta. Solo permite ver el avance; no se puede modificar nada.</p>
    <label for="clave">Clave</label>
    <input id="clave" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••">
    <button class="btn" id="b-entrar">Entrar</button>
    <div id="m-login"></div>
  </section>

  <section id="v-tab" class="hide"></section>
</main>

<script src="../escaner/config.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const LS = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} } };
const NF = new Intl.NumberFormat('es-MX');
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
let DATA = null, VISTA = { per: 'sem', mun: null };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function msg(txt, cls) { $('m-login').innerHTML = txt ? '<div class="msg ' + cls + '">' + esc(txt) + '</div>' : ''; }

async function cargar(clave, mun) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(mun ? { accion: 'tablero', clave, mun } : { accion: 'tablero', clave }) });
  let j; try { j = await r.json(); } catch (_) { throw new Error('El servidor no respondió bien. Intenta de nuevo en un momento.'); }
  if (!j.ok) throw new Error(j.error || 'Error');
  return j.data;
}
async function entrar(auto) {
  const clave = $('clave').value.trim();
  if (!/^\d{4,6}$/.test(clave)) return auto ? null : msg('Escribe tu clave (solo números).', 'bad');
  $('b-entrar').disabled = true; msg('Entrando…', 'warn');
  try {
    DATA = await cargar(clave); LS.set('clave', clave); VISTA = { per: 'sem', mun: null };
    msg(''); $('v-login').classList.add('hide'); $('v-tab').classList.remove('hide'); $('b-salir').classList.remove('hide'); pintar();
  } catch (e) { if (auto) LS.set('clave', ''); msg(e.message, 'bad'); }
  $('b-entrar').disabled = false;
}
$('b-entrar').onclick = () => entrar(false);
$('clave').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(false); });
$('b-salir').onclick = () => { LS.set('clave', ''); DATA = null; $('clave').value = ''; $('v-tab').classList.add('hide'); $('b-salir').classList.add('hide'); $('v-login').classList.remove('hide'); };
if (LS.get('clave')) { $('clave').value = LS.get('clave'); entrar(true); }

// ---------- fechas y agrupación
function dUTC(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function iso(ms) { const d = new Date(ms); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); }
function lunes(s) { const ms = dUTC(s), dow = (new Date(ms).getUTCDay() + 6) % 7; return ms - dow * 86400000; }
function etSem(ms) { const d = new Date(ms); return d.getUTCDate() + ' ' + MESES[d.getUTCMonth()]; }
function hoyMX() { return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Mexico_City' })); }
function hoyISO() { const h = hoyMX(); return h.getFullYear() + '-' + String(h.getMonth() + 1).padStart(2, '0') + '-' + String(h.getDate()).padStart(2, '0'); }

function periodos(porDia, per) {          // devuelve [{et, n}] continuo desde el primer periodo hasta hoy
  const ks = Object.keys(porDia).sort(); if (!ks.length) return [];
  const hoy = hoyISO(), fin = hoy > ks[ks.length - 1] ? hoy : ks[ks.length - 1];
  const out = [];
  if (per === 'sem') {
    const m = {}; ks.forEach(k => { const l = lunes(k); m[l] = (m[l] || 0) + porDia[k]; });
    for (let t = lunes(ks[0]); t <= lunes(fin); t += 7 * 86400000) out.push({ et: etSem(t), n: m[t] || 0 });
  } else if (per === 'mes') {
    const m = {}; ks.forEach(k => { const c = k.slice(0, 7); m[c] = (m[c] || 0) + porDia[k]; });
    let [y, mo] = ks[0].split('-').map(Number); const [y2, mo2] = fin.split('-').map(Number);
    while (y < y2 || (y === y2 && mo <= mo2)) { const c = y + '-' + String(mo).padStart(2, '0'); out.push({ et: MESES[mo - 1] + ' ' + String(y).slice(2), n: m[c] || 0 }); mo++; if (mo > 12) { mo = 1; y++; } }
  } else {
    const m = porDia; for (let t = dUTC(ks[0]); t <= dUTC(fin); t += 86400000) { const d = new Date(t); out.push({ et: d.getUTCDate() + '/' + (d.getUTCMonth() + 1), n: m[iso(t)] || 0 }); }
  }
  return out;
}
function suma(porDia, desde) { let s = 0; Object.keys(porDia).forEach(k => { if (k >= desde) s += porDia[k]; }); return s; }
function restaDias(s, n) { return iso(dUTC(s) - n * 86400000); }

// ---------- gráficas (SVG)
function barras(vals, meta) {
  const W = Math.max(320, vals.length * 46), H = 190, pl = 34, pb = 26, pt = 14, mx = Math.max(4, meta || 0, ...vals.map(v => v.n));
  const bw = (W - pl) / vals.length, cell = Math.min(34, bw - 8);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Capturados por periodo">';
  [0, .5, 1].forEach(f => { const y = pt + (H - pt - pb) * (1 - f); s += '<line x1="' + pl + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="#dde3ec"/><text x="' + (pl - 6) + '" y="' + (y + 4) + '" font-size="10" text-anchor="end" fill="#64708a">' + NF.format(Math.round(mx * f)) + '</text>'; });
  vals.forEach((v, i) => {
    const h = (H - pt - pb) * v.n / mx, x = pl + i * bw + (bw - cell) / 2, y = H - pb - h;
    s += '<rect x="' + x + '" y="' + y + '" width="' + cell + '" height="' + Math.max(h, v.n ? 2 : 0) + '" rx="3" fill="' + (meta && v.n >= meta ? '#2f855a' : '#13294b') + '"/>';
    if (v.n) s += '<text x="' + (x + cell / 2) + '" y="' + (y - 4) + '" font-size="10" text-anchor="middle" fill="#1b2433">' + NF.format(v.n) + '</text>';
    s += '<text x="' + (x + cell / 2) + '" y="' + (H - 8) + '" font-size="10" text-anchor="middle" fill="#64708a">' + esc(v.et) + '</text>';
  });
  if (meta) { const y = pt + (H - pt - pb) * (1 - meta / mx); s += '<line x1="' + pl + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="#c9a227" stroke-width="2" stroke-dasharray="6 4"/><text x="' + (W - 2) + '" y="' + (y - 5) + '" font-size="11" text-anchor="end" fill="#b7791f">Meta ' + NF.format(Math.round(meta * 10) / 10) + '</text>'; }
  return s + '</svg>';
}
function acumulado(porDia, meta, total, diaD) {
  const ks = Object.keys(porDia).sort(); if (!ks.length) return '<p class="sub">Aún no hay capturas con fecha.</p>';
  const hoy = hoyISO(), ini = dUTC(ks[0]), fin = Math.max(dUTC(diaD), dUTC(hoy)), W = 640, H = 220, pl = 44, pr = 12, pt = 14, pb = 26;
  const mx = Math.max(meta, total, 1) * 1.05, X = t => pl + (W - pl - pr) * (t - ini) / Math.max(1, fin - ini), Y = v => pt + (H - pt - pb) * (1 - v / mx);
  let acc = 0, pts = [];
  for (let t = ini; t <= dUTC(hoy); t += 86400000) { acc += porDia[iso(t)] || 0; pts.push([X(t), Y(acc)]); }
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Avance acumulado contra la meta">';
  [0, .5, 1].forEach(f => { const y = pt + (H - pt - pb) * (1 - f); s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="#dde3ec"/><text x="' + (pl - 6) + '" y="' + (y + 4) + '" font-size="10" text-anchor="end" fill="#64708a">' + NF.format(Math.round(mx * f)) + '</text>'; });
  s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(meta) + '" y2="' + Y(meta) + '" stroke="#c9a227" stroke-width="2" stroke-dasharray="6 4"/><text x="' + (W - pr) + '" y="' + (Y(meta) - 5) + '" font-size="11" text-anchor="end" fill="#b7791f">Meta ' + NF.format(meta) + '</text>';
  if (dUTC(diaD) > dUTC(hoy)) { const x1 = pts[pts.length - 1][0], y1 = pts[pts.length - 1][1]; s += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + X(dUTC(diaD)) + '" y2="' + Y(meta) + '" stroke="#64708a" stroke-width="1.5" stroke-dasharray="3 4"/>'; }
  s += '<polyline fill="none" stroke="#13294b" stroke-width="2.5" points="' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/>';
  const l = pts[pts.length - 1]; s += '<circle cx="' + l[0] + '" cy="' + l[1] + '" r="4" fill="#13294b"/>';
  const lab = (t, a) => { const d = new Date(t); return '<text x="' + X(t) + '" y="' + (H - 8) + '" font-size="10" text-anchor="' + a + '" fill="#64708a">' + d.getUTCDate() + ' ' + MESES[d.getUTCMonth()] + ' ' + String(d.getUTCFullYear()).slice(2) + '</text>'; };
  s += lab(ini, 'start') + lab(dUTC(diaD), 'end');
  return s + '</svg><div class="nota">Línea gris punteada: ritmo necesario desde hoy para llegar a la meta el día de la elección (' + diaD.split('-').reverse().join('/') + ').</div>';
}

// ---------- vistas
function claseAv(p) { return p >= 80 ? 'ok' : p >= 40 ? 'med' : 'bajo'; }
function kpi(n, t) { return '<div class="kpi"><div class="n">' + n + '</div><div class="t">' + t + '</div></div>'; }

function vistaMunicipio(r, d) {
  const hoy = hoyISO(), pct = r.meta ? Math.min(100, r.total * 100 / r.meta) : 0, falta = Math.max(0, r.meta - r.total);
  const dias = Math.max(0, Math.ceil((dUTC(d.diaD) - dUTC(hoy)) / 86400000)), ritmo = dias ? Math.ceil(falta / dias) : falta;
  const u7 = suma(r.porDia, restaDias(hoy, 6)), upd = r.actualizado ? new Date(r.actualizado).toLocaleString('es-MX', { timeZone: 'America/Mexico_City', dateStyle: 'short', timeStyle: 'short' }) : '';
  let h = '<h1>' + esc(r.nombre) + '</h1><div class="sub">Datos al ' + esc(upd) + ' · ' + NF.format(r.casillas) + ' casillas</div><div style="height:12px"></div>';
  h += '<div class="kpis">' + kpi(NF.format(r.total), 'Promovidos capturados') + kpi(NF.format(r.meta), r.metaReal ? 'Meta (voto duro real)' : 'Meta (supuesto ' + d.metaXCasilla + ' por casilla)') +
       kpi(pct.toFixed(1) + '%', 'Avance de la meta') + kpi(NF.format(u7), 'Capturados en los últimos 7 días') + kpi(NF.format(dias), 'Días para la elección') + kpi(NF.format(ritmo), 'Por día para llegar a la meta') + '</div>';
  h += '<div class="card"><h2>Avance contra la meta</h2><div class="prog"><i style="width:' + pct + '%"></i></div><div class="sub">' + NF.format(r.total) + ' de ' + NF.format(r.meta) + ' · faltan ' + NF.format(falta) + '</div></div>';
  h += '<div class="card"><h2>Promoción por periodo</h2><div class="tabs" id="tabs"><button data-p="dia">Diario</button><button data-p="sem">Semanal</button><button data-p="mes">Mensual</button></div><div class="chart" id="ch-per"></div></div>';
  h += '<div class="card"><h2>Avance acumulado</h2><div id="ch-acu">' + acumulado(r.porDia, r.meta, r.total, d.diaD) + '</div></div>';
  const pr = (r.promotores || []).slice().sort((a, b) => b.capturados - a.capturados);
  const extra = Object.keys(r.porPromotor || {}).filter(n => !pr.some(p => p.nombre === n)).map(n => ({ nombre: n, secciones: '', meta: 0, capturados: r.porPromotor[n], porDia: (r.porPromotorDia || {})[n] || {} }));
  const todos = pr.concat(extra).sort((a, b) => b.capturados - a.capturados);
  if (todos.length) h += '<div class="card"><h2>Avance por promotor</h2><select id="sel-prom" class="txt" style="margin-bottom:10px;width:100%;padding:10px;border:1px solid #dde3ec;border-radius:10px;background:#fff">' + todos.map(p => '<option value="' + esc(p.nombre) + '"' + (p.nombre === VISTA.prom ? ' selected' : '') + '>' + esc(p.nombre) + '</option>').join('') + '</select><div id="kp-prom" class="kpis"></div><div class="tabs" id="tabs-prom"><button data-p="sem">Semanal</button><button data-p="mes">Mensual</button></div><div class="chart" id="ch-prom"></div><div class="nota" id="nt-prom"></div></div>';
  h += '<div class="grid2"><div class="card"><h2>Por promotor</h2>';
  if (todos.length || r.sinPromotor) {
    h += '<table><tr><th>Promotor</th><th class="num">Capturados</th><th>Meta</th></tr>';
    todos.forEach(p => { const a = p.meta ? Math.min(100, p.capturados * 100 / p.meta) : 0; h += '<tr><td>' + esc(p.nombre) + (p.secciones ? '<div class="sub">Secc. ' + esc(p.secciones) + '</div>' : '') + '</td><td class="num">' + NF.format(p.capturados) + '</td><td>' + (p.meta ? '<div class="mini ' + claseAv(a) + '"><i style="width:' + a + '%"></i></div><div class="sub">' + a.toFixed(0) + '% de ' + NF.format(p.meta) + '</div>' : '<span class="sub">sin meta</span>') + '</td></tr>'; });
    if (r.sinPromotor) h += '<tr><td><i>Sin promotor registrado</i></td><td class="num">' + NF.format(r.sinPromotor) + '</td><td></td></tr>';
    h += '</table>';
  } else h += '<p class="sub">Aún no hay promotores ni capturas.</p>';
  h += '</div><div class="card"><h2>Por sección</h2>';
  const secs = Object.keys(r.porSeccion || {}).sort((a, b) => r.porSeccion[b] - r.porSeccion[a]), mx = Math.max(1, ...secs.map(s => r.porSeccion[s]));
  if (secs.length) { h += '<table><tr><th>Sección</th><th class="num">Capturados</th><th></th></tr>'; secs.forEach(s => { h += '<tr><td>' + esc(s) + '</td><td class="num">' + NF.format(r.porSeccion[s]) + '</td><td><div class="mini"><i style="width:' + (r.porSeccion[s] * 100 / mx) + '%"></i></div></td></tr>'; }); h += '</table>'; }
  else h += '<p class="sub">Aún no hay capturas.</p>';
  h += '</div></div>';
  if (r.sinFecha) h += '<p class="nota">' + NF.format(r.sinFecha) + ' registro(s) se capturaron antes de que existiera la fecha de captura; cuentan en el total pero no en las gráficas por periodo.</p>';
  return h;
}
function sumaTodos(ms) {
  const t = { nombre: 'Todos los municipios', casillas: 0, meta: 0, metaReal: false, total: 0, porDia: {}, porSeccion: {}, porPromotor: {}, sinPromotor: 0, sinFecha: 0, promotores: [], actualizado: '' };
  ms.forEach(m => { t.casillas += m.casillas; t.meta += m.meta; t.total += m.total; t.sinFecha += m.sinFecha; t.sinPromotor += m.sinPromotor; Object.keys(m.porDia).forEach(k => t.porDia[k] = (t.porDia[k] || 0) + m.porDia[k]); if (m.actualizado && m.actualizado > t.actualizado) t.actualizado = m.actualizado; });
  return t;
}
function sinAcento(x) { return String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
function vistaAdmin(d) {
  const ms = Object.values(d.municipios || {});
  if (VISTA.mun && d.municipios[VISTA.mun]) return '<button class="back" id="b-volver">← Todos los municipios</button>' + vistaMunicipio(d.municipios[VISTA.mun], d);
  if (!ms.length) return '<div class="card"><h2>Aún no hay datos calculados</h2><p class="sub">El resumen general se calcula en el servidor. Corre «actualizarResumen» y vuelve a entrar.</p></div>';
  const t = sumaTodos(ms), q = sinAcento(VISTA.q || '');
  let h = vistaMunicipio(Object.assign(t, { porSeccion: {}, porPromotor: {} }), d).replace(/<div class="grid2">[\s\S]*$/, '');
  h += '<div class="card"><h2>Municipios</h2><input class="txt" id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Buscar municipio" value="' + esc(VISTA.q || '') + '"><div style="height:8px"></div><table><tr><th>Municipio</th><th class="num">Capturados</th><th class="num">Meta</th><th>Avance</th><th class="num">7 días</th></tr>';
  const hoy = hoyISO();
  ms.sort((a, b) => (b.total / (b.meta || 1)) - (a.total / (a.meta || 1)) || b.total - a.total).forEach(m => {
    const a = m.meta ? Math.min(100, m.total * 100 / m.meta) : 0;
    h += '<tr class="click" data-n="' + esc(sinAcento(m.nombre)) + '" data-m="' + esc(m.nombre.replace(/ /g, '_')) + '"' + (sinAcento(m.nombre).includes(q) ? '' : ' style="display:none"') + '><td>' + esc(m.nombre) + '</td><td class="num">' + NF.format(m.total) + '</td><td class="num">' + NF.format(m.meta) + '</td><td><div class="mini ' + claseAv(a) + '"><i style="width:' + a + '%"></i></div><div class="sub">' + a.toFixed(1) + '%</div></td><td class="num">' + NF.format(suma(m.porDia, restaDias(hoy, 6))) + '</td></tr>';
  });
  return h + '</table><p class="nota">Toca un municipio para ver su detalle. El resumen general se actualiza cada cierto tiempo, no al instante.</p></div>';
}
function dibujarPromotor(p, diaD, per) {
  const hoy = hoyISO(), pd = p.porDia || {}, ks = Object.keys(pd).sort();
  const ini = ks.length && ks[0] < hoy ? ks[0] : hoy;
  const nSem = Math.max(1, Math.floor((lunes(diaD) - lunes(ini)) / (7 * 86400000)) + 1);
  const [y1, m1] = ini.split('-').map(Number), [y2, m2] = diaD.split('-').map(Number), nMes = Math.max(1, (y2 - y1) * 12 + (m2 - m1) + 1);
  const mP = p.meta ? p.meta / (per === 'sem' ? nSem : nMes) : 0;
  const pct = p.meta ? Math.min(100, p.capturados * 100 / p.meta) : 0;
  const v = periodos(pd, per), act = v.length ? v[v.length - 1].n : 0;
  $('kp-prom').innerHTML = kpi(NF.format(p.capturados), 'Capturados') + kpi(p.meta ? NF.format(p.meta) : '—', 'Meta total') + kpi(p.meta ? pct.toFixed(1) + '%' : '—', 'Avance') +
    kpi(p.meta ? NF.format(Math.round(mP * 10) / 10) : '—', per === 'sem' ? 'Meta por semana' : 'Meta por mes') + kpi(NF.format(act), per === 'sem' ? 'Esta semana' : 'Este mes');
  $('tabs-prom').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.p === per));
  $('ch-prom').innerHTML = v.length ? barras(v, mP) : '<p class="sub">Este promotor aún no tiene capturas con fecha.</p>';
  $('nt-prom').textContent = p.meta ? 'La línea dorada es la meta de cada ' + (per === 'sem' ? 'semana' : 'mes') + ': su meta total repartida entre los ' + (per === 'sem' ? nSem + ' semanas' : nMes + ' meses') + ' que van de hoy al día de la elección. Las barras en verde llegaron a la meta.' : 'Este promotor no tiene meta. Escríbela en la pestaña «Promotores» de la hoja del municipio (columna Meta) y aparecerá aquí.';
}
function refrescarMunicipio(key) {   // con la clave general: recalcula ese municipio al momento
  const y = window.scrollY;
  cargar(LS.get('clave'), key).then(d => { if (d.vivo && DATA && VISTA.mun === key) { DATA.municipios[key] = d.vivo; pintar(); window.scrollTo(0, y); } }).catch(() => {});
}
function pintar() {
  const el = $('v-tab');
  const r = DATA.admin ? (VISTA.mun && DATA.municipios[VISTA.mun] ? DATA.municipios[VISTA.mun] : sumaTodos(Object.values(DATA.municipios || {}))) : DATA.municipio;
  el.innerHTML = DATA.admin ? vistaAdmin(DATA) : vistaMunicipio(DATA.municipio, DATA);
  const b = $('b-volver'); if (b) b.onclick = () => { VISTA.mun = null; pintar(); window.scrollTo(0, 0); };
  el.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => { VISTA.mun = tr.dataset.m; pintar(); window.scrollTo(0, 0); refrescarMunicipio(tr.dataset.m); });
  const qi = $('q'); if (qi) { qi.oninput = () => { VISTA.q = qi.value; const f = sinAcento(qi.value); el.querySelectorAll('tr.click').forEach(tr => { tr.style.display = tr.dataset.n.includes(f) ? '' : 'none'; }); }; }
  const sp = $('sel-prom');
  if (sp) {
    const m = DATA.admin ? (VISTA.mun && DATA.municipios[VISTA.mun]) : DATA.municipio;
    const lista = (m.promotores || []).concat(Object.keys(m.porPromotor || {}).filter(n => !(m.promotores || []).some(p => p.nombre === n)).map(n => ({ nombre: n, meta: 0, capturados: m.porPromotor[n], porDia: (m.porPromotorDia || {})[n] || {} })));
    if (!VISTA.prom || !lista.some(p => p.nombre === VISTA.prom)) VISTA.prom = sp.value; else sp.value = VISTA.prom;
    const dibP = () => dibujarPromotor(lista.find(p => p.nombre === VISTA.prom), DATA.diaD, VISTA.perP || 'sem');
    sp.onchange = () => { VISTA.prom = sp.value; dibP(); };
    $('tabs-prom').querySelectorAll('button').forEach(x => x.onclick = () => { VISTA.perP = x.dataset.p; dibP(); });
    dibP();
  }
  const ch = $('ch-per'); if (!ch) return;
  const datos = DATA.admin && !VISTA.mun ? sumaTodos(Object.values(DATA.municipios || {})).porDia : r.porDia;
  const dib = () => { const v = periodos(datos, VISTA.per); ch.innerHTML = v.length ? barras(v) : '<p class="sub">Aún no hay capturas con fecha.</p>'; $('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.p === VISTA.per)); };
  $('tabs').querySelectorAll('button').forEach(x => x.onclick = () => { VISTA.per = x.dataset.p; dib(); });
  dib();
}
</script>
